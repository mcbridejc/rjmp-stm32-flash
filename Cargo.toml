[package]
name = "rjmp-stm32-flash"
version = "0.1.0"
edition = "2024"

[dependencies]
stm32-metapac = { version = "19.0.0", features = ["pac"] }
defmt = { version = "1.0.1", optional = true }
cortex-m = "0.7.7"
embedded-storage = "0.3.1"
embedded-io = "0.7.1"

[features]
default = []
defmt = ["dep:defmt"]
stm32g431xb = ["stm32-metapac/stm32g431cb"]
stm32g431x8 = ["stm32-metapac/stm32g431c8"]
stm32g431x6 = ["stm32-metapac/stm32g431c6"]
